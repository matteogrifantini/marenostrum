name: Forecast Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-forecasts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Forecast Sync Endpoint
        run: |
          curl -f -X GET "https://marenostrum.app/api/cron/forecast" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
